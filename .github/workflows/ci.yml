name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        run: |
          npm install --global pnpm@10.28.0
          pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: The README's demo commands run
        run: |
          mkdir -p .out
          pnpm -s showroom run examples/lead-0952pm.json --queue .out/outbox.jsonl
          pnpm -s showroom backtest examples/transcripts --gate .out/gate
      - name: A STOP after a reply was queued holds the reply, and nothing reaches the provider
        run: |
          mkdir -p .out
          pnpm -s showroom run examples/lead-0952pm-stop.json --queue .out/stop.jsonl
          pnpm -s showroom switch .out/switch.txt on
          pnpm -s showroom send .out/stop.jsonl --ledger .out/stop-ledger.jsonl --switch .out/switch.txt --live --now 2026-11-05T08:00:00-08:00 | tee .out/stop-send.txt
          grep -q "held  *stop_honored: the customer opted out" .out/stop-send.txt
          test ! -e .out/stop-ledger.jsonl.provider.jsonl
      - name: The synthetic data regenerates byte for byte
        run: |
          pnpm -s synth
          git diff --exit-code examples/

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Test the holdout readout
        run: python -m unittest discover -s analysis -v
      - name: The readout runs, and refuses the agent's own log
        run: |
          python analysis/holdout.py examples/experiment
          set +e
          python analysis/holdout.py examples/experiment --outcomes examples/experiment/agent-bookings.jsonl
          test $? -eq 2
